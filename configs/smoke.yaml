project:
  name: for2107_tozzi_smoke
  root: ..
  random_seed: 2107
  mode: smoke

inputs:
  bids_root: ../data/raw_examples
  clinical_files:
    - ../data/Datenbank_Update_DataFreeze1-4-10012025.sav
    - ../data/Datenbank_DataFreeze3-4_Follow-Up_10012025.sav
  primary_clinical_file: ../data/Datenbank_Update_DataFreeze1-4-10012025.sav
  subject_map: null
  events_root: null
  fmriprep_derivatives: ../derivatives/fmriprep

outputs:
  root: ../derivatives/for2107_tozzi
  bids_staging: ../derivatives/bids_staging
  reports: ../reports
  work: ../work

selection:
  session: ses-01
  clinical_diagnoses: [MDD, anxiety]
  include_all_diagnoses: false
  healthy_labels: [HC, healthy, control]
  variable_map: variable_map.yaml
  subject_id_prefix: sub-
  subject_id_width: 4

preprocessing:
  backend: docker
  execute: false
  image: nipreps/fmriprep:25.1.4
  freesurfer_license: ../license.txt
  output_spaces: [MNI152NLin2009cAsym:res-2]
  fs_no_reconall: true
  n_cpus: 4
  memory_mb: 12000
  fd_threshold_mm: 0.5
  max_high_motion_fraction: 0.25

features:
  tier: primary_multimodal
  mapping: feature_map.yaml
  tozzi_repository: https://github.com/leotozzi88/cluster_study_2023.git
  tozzi_revision: 3e8d33df397d4854bd6860423bed88c546501eb7
  roi_directory: ../derivatives/reference/tozzi_rois
  confounds: [trans_x, trans_y, trans_z, rot_x, rot_y, rot_z, white_matter, csf]
  high_pass_hz: 0.008
  low_pass_hz: 0.09
  smoothing_fwhm_mm: 6.0

analysis:
  candidate_clusters: [2, 3, 4, 5, 6]
  selected_clusters: 3
  null_iterations: 50
  permutation_iterations: 50
  subsample_iterations: 50
  subsample_fraction: 0.8
  imputation_iterations: 1
  n_jobs: 1
  full_scale_iterations: 10000
  minimum_reference_n: 20
  minimum_clustering_n: 30

report:
  title: FOR2107 multimodal adaptation of Tozzi et al. (2024)
  formats: [html, pdf]
  theme: light
