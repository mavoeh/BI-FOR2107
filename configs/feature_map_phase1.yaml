version: 1
status: ready_resting_state_phase1
tiers:
  rest_phase1_edges:
    include_tasks: [rest]
    description: Fourteen published Tozzi task-free connections retained as separate features.

# Region codes and connections follow Tozzi et al. Supplementary Table 18.
# Each two-ROI definition yields one Fisher-z transformed connection rather
# than the circuit-wide averages used by the earlier exploratory analysis.
